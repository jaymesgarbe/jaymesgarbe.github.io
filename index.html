<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuoVR - 360° Video Upload</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .upload-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .upload-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            background-size: 400% 400%;
            animation: gradient 3s ease infinite;
        }

        @keyframes gradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 40px;
        }

        .drop-zone {
            border: 3px dashed #ddd;
            border-radius: 16px;
            padding: 60px 30px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: #fafafa;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .drop-zone::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.3s ease;
        }

        .drop-zone:hover::before {
            transform: translate(-50%, -50%) scale(1);
        }

        .drop-zone.drag-over {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }

        .drop-zone.uploading {
            border-color: #4ecdc4;
            background: rgba(78, 205, 196, 0.05);
        }

        .drop-zone-content {
            position: relative;
            z-index: 2;
        }

        .upload-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .drop-zone:hover .upload-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .upload-icon svg {
            width: 40px;
            height: 40px;
            color: white;
        }

        .drop-text {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .drop-subtext {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .file-types {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .file-type {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .browse-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .browse-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .file-input {
            display: none;
        }

        .upload-progress {
            margin-top: 30px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ecdc4, #44a08d);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .progress-text {
            color: #666;
            font-size: 14px;
        }

        .upload-result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 12px;
            display: none;
        }

        .upload-success {
            background: rgba(76, 175, 80, 0.1);
            border: 2px solid #4caf50;
            color: #2e7d32;
        }

        .upload-error {
            background: rgba(244, 67, 54, 0.1);
            border: 2px solid #f44336;
            color: #c62828;
        }

        .result-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .result-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .result-details {
            font-size: 14px;
            opacity: 0.8;
        }

        .file-info {
            background: rgba(102, 126, 234, 0.1);
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
            text-align: left;
            display: none;
        }

        .file-info h4 {
            color: #333;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .file-detail {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 14px;
            color: #666;
        }

        .reset-button {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            border: 2px solid #667eea;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.3s ease;
        }

        .reset-button:hover {
            background: #667eea;
            color: white;
        }

        @media (max-width: 768px) {
            .upload-container {
                padding: 30px 20px;
                margin: 10px;
            }

            .drop-zone {
                padding: 40px 20px;
            }

            .drop-text {
                font-size: 20px;
            }

            .file-types {
                gap: 8px;
            }

            .file-type {
                font-size: 12px;
                padding: 6px 12px;
            }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="upload-container">
        <div class="logo">DuoVR</div>
        <div class="subtitle">Upload your 360° and 180° videos to the cloud</div>
        
        <div class="drop-zone" id="dropZone">
            <div class="drop-zone-content">
                <div class="upload-icon">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z" />
                    </svg>
                </div>
                
                <div class="drop-text">Drop your videos here</div>
                <div class="drop-subtext">or click to browse files</div>
                
                <div class="file-types">
                    <span class="file-type">360° Video</span>
                    <span class="file-type">180° Video</span>
                    <span class="file-type">MP4, MOV, AVI</span>
                </div>
                
                <button class="browse-button" onclick="document.getElementById('fileInput').click()">
                    Browse Files
                </button>
            </div>
        </div>

        <input type="file" id="fileInput" class="file-input" accept="video/mp4,video/quicktime,video/x-msvideo" multiple>

        <div class="file-info" id="fileInfo">
            <h4>Selected File:</h4>
            <div id="fileDetails"></div>
        </div>

        <div class="upload-progress" id="uploadProgress">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Uploading... 0%</div>
        </div>

        <div class="upload-result" id="uploadResult">
            <div class="result-icon" id="resultIcon"></div>
            <div class="result-text" id="resultText"></div>
            <div class="result-details" id="resultDetails"></div>
            <button class="reset-button" onclick="resetUpload()">Upload Another Video</button>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://duovr-server-320457537138.us-west1.run.app';
        
        // Get authentication token - you'll need to implement this
        async function getAuthToken() {
            // For now, we'll show instructions to the user
            const token = prompt('Please enter your access token. Get it by running: gcloud auth print-access-token');
            return token;
        }
        
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileDetails = document.getElementById('fileDetails');
        const uploadProgress = document.getElementById('uploadProgress');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const uploadResult = document.getElementById('uploadResult');
        const resultIcon = document.getElementById('resultIcon');
        const resultText = document.getElementById('resultText');
        const resultDetails = document.getElementById('resultDetails');

        // Drag and drop functionality
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            
            const files = Array.from(e.dataTransfer.files);
            handleFiles(files);
        });

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            handleFiles(files);
        });

        function handleFiles(files) {
            if (files.length === 0) return;

            // Filter for video files only
            const videoFiles = files.filter(file => file.type.startsWith('video/'));
            
            if (videoFiles.length === 0) {
                showError('Please select video files only (MP4, MOV, AVI)');
                return;
            }

            // For now, handle one file at a time
            const file = videoFiles[0];
            
            if (!isValidVideoFile(file)) {
                showError('Please upload only 360° or 180° video files (MP4, MOV, AVI)');
                return;
            }

            showFileInfo(file);
            uploadFile(file);
        }

        function isValidVideoFile(file) {
            const validTypes = ['video/mp4', 'video/quicktime', 'video/x-msvideo'];
            return validTypes.includes(file.type);
        }

        function showFileInfo(file) {
            const sizeInMB = (file.size / (1024 * 1024)).toFixed(2);
            
            fileDetails.innerHTML = `
                <div class="file-detail">
                    <span>Name:</span>
                    <span>${file.name}</span>
                </div>
                <div class="file-detail">
                    <span>Size:</span>
                    <span>${sizeInMB} MB</span>
                </div>
                <div class="file-detail">
                    <span>Type:</span>
                    <span>${file.type}</span>
                </div>
            `;
            
            fileInfo.style.display = 'block';
        }

        async function uploadFile(file) {
            // Show upload progress
            uploadProgress.style.display = 'block';
            dropZone.classList.add('uploading');
            
            try {
                // Get authentication token
                const token = await getAuthToken();
                if (!token) {
                    showError('Authentication token required');
                    return;
                }

                // Create FormData for file upload
                const formData = new FormData();
                formData.append('file', file);

                // Upload with progress tracking
                const xhr = new XMLHttpRequest();
                
                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percentComplete = (e.loaded / e.total) * 100;
                        updateProgress(percentComplete);
                    }
                });

                xhr.addEventListener('load', () => {
                    if (xhr.status === 200) {
                        const response = JSON.parse(xhr.responseText);
                        showSuccess(response);
                    } else {
                        const errorResponse = JSON.parse(xhr.responseText);
                        showError(errorResponse.error || 'Upload failed');
                    }
                });

                xhr.addEventListener('error', () => {
                    showError('Network error occurred during upload');
                });

                xhr.open('POST', `${API_BASE_URL}/files/upload`);
                xhr.setRequestHeader('Authorization', `Bearer ${token}`);
                xhr.send(formData);

            } catch (error) {
                console.error('Upload error:', error);
                showError('Upload failed: ' + error.message);
            }
        }

        function updateProgress(percent) {
            progressFill.style.width = percent + '%';
            progressText.textContent = `Uploading... ${Math.round(percent)}%`;
        }

        function showSuccess(response) {
            hideProgress();
            
            resultIcon.textContent = '✅';
            resultText.textContent = 'Upload Successful!';
            resultDetails.innerHTML = `
                File uploaded successfully!<br>
                <strong>File ID:</strong> ${response.file.id}<br>
                <strong>Path:</strong> ${response.file.path}
            `;
            
            uploadResult.className = 'upload-result upload-success';
            uploadResult.style.display = 'block';
        }

        function showError(message) {
            hideProgress();
            
            resultIcon.textContent = '❌';
            resultText.textContent = 'Upload Failed';
            resultDetails.textContent = message;
            
            uploadResult.className = 'upload-result upload-error';
            uploadResult.style.display = 'block';
        }

        function hideProgress() {
            uploadProgress.style.display = 'none';
            dropZone.classList.remove('uploading');
        }

        function resetUpload() {
            // Reset all UI elements
            fileInput.value = '';
            fileInfo.style.display = 'none';
            uploadProgress.style.display = 'none';
            uploadResult.style.display = 'none';
            dropZone.classList.remove('uploading');
            
            // Reset progress
            progressFill.style.width = '0%';
            progressText.textContent = 'Uploading... 0%';
        }

        // Add some visual flair
        document.addEventListener('DOMContentLoaded', () => {
            // Add pulse animation to upload icon on page load
            const uploadIcon = document.querySelector('.upload-icon');
            uploadIcon.classList.add('pulse');
            
            setTimeout(() => {
                uploadIcon.classList.remove('pulse');
            }, 3000);
        });
    </script>
</body>
</html>
